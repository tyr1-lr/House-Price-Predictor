{% extends "base.html" %}

{% block title %}Notebook{% endblock %}

{% block content %}

<section class="w-full min-h-screen bg-[#fdfaf6] px-6 py-10">

    <div class="max-w-7xl mx-auto">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-5 mb-8">

            <div>
                <h1 class="text-4xl font-bold text-[#4b1e0f]">
                    Jupyter Notebook
                </h1>

                <p class="text-[#666] mt-2 text-lg">
                    California Housing Price Prediction Notebook
                </p>
            </div>

            <a href="{{ url_for('download_notebook') }}"
               class="bg-[#748c55] hover:bg-[#637548] text-white px-6 py-3 rounded-xl transition inline-block">

                Download Notebook

            </a>

        </div>

        <div class="bg-white border border-[#d8c7b5] rounded-3xl overflow-hidden shadow-sm">

            <iframe
                src="{{ url_for('static', filename='house_pricing.html') }}"
                class="w-full h-[900px] bg-white">
            </iframe>

        </div>

    </div>

</section>

{% endblock %}
