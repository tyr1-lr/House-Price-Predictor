{% extends "base.html" %}

{% block title %}Dataset{% endblock %}

<section class="w-full min-h-screen bg-[#fdfaf6] px-10 py-10">

  <div class="max-w-7xl mx-auto bg-white border border-[#d8c7b5] rounded-3xl p-10">

    <h1 class="text-4xl font-bold text-[#4b1e0f] mb-6">

    <p class="text-[#666] mb-8">

    <div class="overflow-x-auto">

  </div>

</section>

{% endblock %}
